name: herway
description: A safety-focused dashboard for the HerWay app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/simulated_call_ringtone.wav

dependencies:
  audioplayers: ^6.1.0
  battery_plus: ^6.2.2
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.14
  flutter_web_plugins:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  http: ^1.3.0
  url_launcher: ^6.3.1
  camera: ^0.12.0+2
  record: ^6.2.1
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
